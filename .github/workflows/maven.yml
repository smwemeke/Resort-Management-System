# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Create Dockerfile
      run: |
        cat <<EOF > Dockerfile
        # Use official OpenJDK as base image
        FROM openjdk:17-jdk-slim

        # Set the working directory inside the container
        WORKDIR /app

        # Copy the JAR file from the build output to the container
        COPY target/*.jar app.jar

        # Run the application
        CMD ["java", "-jar", "app.jar"]   
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Login to Docker registry(using secrets)
      env:
       DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
       DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/resortmanagement:latest .
    - name: List Docker images
      run: docker images  
    - name: Push Docker image to registry
      run: docker push ${{ secrets.DOCKER_USERNAME }}/resortmanagement:latest
  

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
